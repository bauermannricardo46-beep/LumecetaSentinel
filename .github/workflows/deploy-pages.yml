name: Build Lumeceta Sentinel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          elif [ -f ./android/gradlew ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          else
            echo "No Gradle wrapper found; checking for existing APK files."
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p dist
          find . -type f -name '*.apk' -not -path './dist/*' -exec cp {} dist/ \;
          if ! find dist -type f -name '*.apk' | grep -q .; then
            echo "ERROR: No APK was produced or found."
            exit 1
          fi
          ls -lah dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lumeceta-Sentinel-APK
          path: dist/*.apk
          if-no-files-found: error
